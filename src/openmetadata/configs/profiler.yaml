# OpenMetadata Profiler workflow for the medallion lakehouse.
# Connects to the already-registered Trino service ("Trino") and computes
# column metrics (null %, distinct %, min/max/mean) for every bronze/silver/gold
# table. hostPort and jwtToken are injected at runtime.
#
# Trino here is resource-constrained, so the profiler is tuned to be gentle:
#  - threadCount: 1  -> metric queries run sequentially (cascade), never 5 in
#    parallel (the parallel default crashed Trino workers: 503 PAGE_TRANSPORT_ERROR).
#  - profileSample: 10% via TABLESAMPLE -> far less data scanned per query.
#  - timeoutSeconds raised so a slow sampled query is not killed mid-flight.
source:
  type: trino
  serviceName: Trino
  sourceConfig:
    config:
      type: Profiler
      threadCount: 1
      profileSample: 10
      profileSampleType: PERCENTAGE
      timeoutSeconds: 10800
      databaseFilterPattern:
        includes:
          - "^lakehouse$"
      schemaFilterPattern:
        includes:
          - "^bronze$"
          - "^silver$"
          - "^gold$"
processor:
  type: orm-profiler
  config: {}
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata.observability.svc.cluster.local:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ""
