name: Build & publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild: "all" or comma-separated "image:version" (e.g. "spark:3.5.8,jupyterhub-spark:latest")'
        required: false
        default: ''

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Detect which images need rebuilding
  # -------------------------------------------------------------------------
  detect:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix_base:    ${{ steps.plan.outputs.matrix_base }}
      matrix_derived: ${{ steps.plan.outputs.matrix_derived }}
      has_base:       ${{ steps.plan.outputs.has_base }}
      has_derived:    ${{ steps.plan.outputs.has_derived }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to diff arbitrary SHAs

      - name: Resolve BASE / HEAD SHAs
        id: sha
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.sha }}"         >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "base="                          >> "$GITHUB_OUTPUT"
              echo "head=${{ github.sha }}"         >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Compute build plan
        id: plan
        env:
          CONFIG_PATH: docker-images/build-config.yml
          BASE_SHA:    ${{ steps.sha.outputs.base }}
          HEAD_SHA:    ${{ steps.sha.outputs.head }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          set -euo pipefail
          chmod +x .github/detect-changes.sh
          plan="$(.github/detect-changes.sh)"
          echo "Plan:"
          jq . <<<"$plan"

          matrix_base=$(jq    -c '.base'    <<<"$plan")
          matrix_derived=$(jq -c '.derived' <<<"$plan")
          has_base=$(jq    -r '(.base.include    | length) > 0' <<<"$plan")
          has_derived=$(jq -r '(.derived.include | length) > 0' <<<"$plan")

          {
            echo "matrix_base=$matrix_base"
            echo "matrix_derived=$matrix_derived"
            echo "has_base=$has_base"
            echo "has_derived=$has_derived"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 2. Build base images (no dependency on other images in this repo)
  # -------------------------------------------------------------------------
  build-base:
    needs: detect
    if: needs.detect.outputs.has_base == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix_base) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          platforms:  ${{ matrix.platforms }}
          push:       ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}
          cache-to:   type=gha,scope=${{ matrix.image }}-${{ matrix.version }},mode=max

  # -------------------------------------------------------------------------
  # 3. Build derived images (FROM another image built above)
  #    Runs AFTER build-base so the `FROM` reference resolves to the new tag.
  # -------------------------------------------------------------------------
  build-derived:
    needs: [detect, build-base]
    if: |
      !cancelled()
      && needs.detect.outputs.has_derived == 'true'
      && (needs.build-base.result == 'success' || needs.build-base.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix_derived) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          platforms:  ${{ matrix.platforms }}
          push:       ${{ github.event_name != 'pull_request' }}
          pull:       true   # pull fresh base image that was just pushed
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}
          cache-to:   type=gha,scope=${{ matrix.image }}-${{ matrix.version }},mode=max