name: Build & publish Docker images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild: "all" or comma-separated "image:version" (e.g. "spark:3.5.8,airflow:3.1.8")'
        required: false
        default: ''

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # 1. Detect which images need rebuilding and at which dependency level
  # -------------------------------------------------------------------------
  detect:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix_level_0: ${{ steps.plan.outputs.matrix_level_0 }}
      matrix_level_1: ${{ steps.plan.outputs.matrix_level_1 }}
      matrix_level_2: ${{ steps.plan.outputs.matrix_level_2 }}
      matrix_level_3: ${{ steps.plan.outputs.matrix_level_3 }}
      matrix_level_4: ${{ steps.plan.outputs.matrix_level_4 }}
      has_level_0:    ${{ steps.plan.outputs.has_level_0 }}
      has_level_1:    ${{ steps.plan.outputs.has_level_1 }}
      has_level_2:    ${{ steps.plan.outputs.has_level_2 }}
      has_level_3:    ${{ steps.plan.outputs.has_level_3 }}
      has_level_4:    ${{ steps.plan.outputs.has_level_4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to diff arbitrary SHAs

      - name: Resolve BASE / HEAD SHAs
        id: sha
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.sha }}"         >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "base="                          >> "$GITHUB_OUTPUT"
              echo "head=${{ github.sha }}"         >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Compute build plan
        id: plan
        env:
          CONFIG_PATH: docker-images/build-config.yml
          BASE_SHA:    ${{ steps.sha.outputs.base }}
          HEAD_SHA:    ${{ steps.sha.outputs.head }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          set -euo pipefail
          chmod +x .github/detect-changes.sh
          plan="$(.github/detect-changes.sh)"
          echo "Plan:"
          jq . <<<"$plan"

          for i in 0 1 2 3 4; do
            m=$(jq -c ".level_$i" <<<"$plan")
            h=$(jq -r "(.level_$i.include | length) > 0" <<<"$plan")
            echo "matrix_level_$i=$m" >> "$GITHUB_OUTPUT"
            echo "has_level_$i=$h"    >> "$GITHUB_OUTPUT"
          done

  # -------------------------------------------------------------------------
  # 2..6. Build each dependency level in order. Level N waits for all
  #       earlier levels; failure at any ancestor level cascades via !failure().
  # -------------------------------------------------------------------------
  build-level-0:
    needs: detect
    if: needs.detect.outputs.has_level_0 == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix_level_0 }}
    secrets: inherit

  build-level-1:
    needs: [detect, build-level-0]
    if: |
      !cancelled()
      && !failure()
      && needs.detect.outputs.has_level_1 == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix_level_1 }}
    secrets: inherit

  build-level-2:
    needs: [detect, build-level-0, build-level-1]
    if: |
      !cancelled()
      && !failure()
      && needs.detect.outputs.has_level_2 == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix_level_2 }}
    secrets: inherit

  build-level-3:
    needs: [detect, build-level-0, build-level-1, build-level-2]
    if: |
      !cancelled()
      && !failure()
      && needs.detect.outputs.has_level_3 == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix_level_3 }}
    secrets: inherit

  build-level-4:
    needs: [detect, build-level-0, build-level-1, build-level-2, build-level-3]
    if: |
      !cancelled()
      && !failure()
      && needs.detect.outputs.has_level_4 == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix_level_4 }}
    secrets: inherit