name: Build & Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "docker-images/**"
      - "src/spark/**"
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      has_changes: ${{ steps.changed.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ← récupérer tout l'historique

      - name: Detect changed images
        id: changed
        run: |
          # Comparer avec le commit précédent
          if git rev-parse HEAD~1 > /dev/null 2>&1; then
            BASE="HEAD~1"
          else
            BASE="$(git hash-object -t tree /dev/null)"  # ← arbre vide si 1er commit
          fi

          CHANGED=$(git diff --name-only $BASE HEAD \
            | grep '^docker-images/[^/]*/[^/]*/' \
            | awk -F'/' '{print "{\"image\":\""$2"\",\"version\":\""$3"\"}"}' \
            | jq -s -c '.')

          # Check if src/spark changed - if so, add spark:3.5.8 to build
          if git diff --name-only $BASE HEAD | grep -q '^src/spark/'; then
            SPARK_IMAGE='{"image":"spark","version":"3.5.8"}'
            if [ "$CHANGED" = "[]" ] || [ -z "$CHANGED" ]; then
              CHANGED="[$SPARK_IMAGE]"
            else
              CHANGED=$(echo "$CHANGED" | jq -c ". + [$SPARK_IMAGE] | unique")
            fi
          fi

          echo "Changed files: $CHANGED"

          if [ "$CHANGED" = "[]" ] || [ -z "$CHANGED" ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "matrix={\"include\":$CHANGED}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.has_changes == 'true'

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-images/${{ matrix.image }}/${{ matrix.version }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.version }}
