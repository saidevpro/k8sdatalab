name: Build Docker image (reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix object ({"include":[...]}) for one level.'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Images named "aws-*" publish to Amazon ECR; all others to Docker Hub.
      - name: Resolve target registry
        id: target
        run: |
          if [[ "${{ matrix.image }}" == aws-* ]]; then
            echo "kind=ecr" >> "$GITHUB_OUTPUT"
            echo "repo=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=dockerhub" >> "$GITHUB_OUTPUT"
            echo "repo=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.target.outputs.kind == 'dockerhub' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS credentials
        if: steps.target.outputs.kind == 'ecr' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.target.outputs.kind == 'ecr' && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        if: steps.target.outputs.kind == 'ecr' && github.event_name != 'pull_request'
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.image }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${{ matrix.image }}" >/dev/null

      - name: Build ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          platforms:  ${{ matrix.platforms }}
          push:       ${{ github.event_name != 'pull_request' }}
          pull:       true   # pick up freshly-pushed base images from earlier levels
          tags: |
            ${{ steps.target.outputs.repo }}:${{ matrix.version }}
            ${{ steps.target.outputs.repo }}:${{ matrix.version }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}
          cache-to:   type=gha,scope=${{ matrix.image }}-${{ matrix.version }},mode=max
