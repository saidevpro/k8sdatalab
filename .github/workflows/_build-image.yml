name: Build Docker image (reusable)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON matrix object ({"include":[...]}) for one level.'
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.image }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          platforms:  ${{ matrix.platforms }}
          push:       ${{ github.event_name != 'pull_request' }}
          pull:       true   # pick up freshly-pushed base images from earlier levels
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ matrix.version }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.version }}
          cache-to:   type=gha,scope=${{ matrix.image }}-${{ matrix.version }},mode=max