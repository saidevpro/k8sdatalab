apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: airflow
  namespace: data-platform
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`airflow.k8sdatalab.com`)
      kind: Rule
      services:
        - name: airflow-api-server
          port: 8080
  tls:
    secretName: wildcard-tls
