apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: infrastructure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.k8sdatalab.com`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
  tls:
    secretName: wildcard-tls
