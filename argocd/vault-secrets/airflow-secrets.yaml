apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-admin-secret
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: airflow-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod/airflow/admin-user
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata-db-secret
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: airflow-metadata-connection
    creationPolicy: Owner
    template:
      data:
        connection: "postgresql+psycopg2://airflow:{{ .password }}@postgresql-data-platform.data-platform.svc.cluster.local:5432/airflow"
  data:
    - secretKey: password
      remoteRef:
        key: prod/airflow/metadata-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-secret
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: airflow-secret-keys
    creationPolicy: Owner
  data:
    - secretKey: fernet-key
      remoteRef:
        key: prod/airflow/server_keys
        property: fernet_key
    - secretKey: webserver-secret-key
      remoteRef:
        key: prod/airflow/server_keys
        property: webserver_key
    - secretKey: api-secret-key
      remoteRef:
        key: prod/airflow/server_keys
        property: api_key
    - secretKey: jwt-secret
      remoteRef:
        key: prod/airflow/server_keys
        property: jwt_key