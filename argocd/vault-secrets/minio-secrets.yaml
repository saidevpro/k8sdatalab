apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-warehouse-secret
  namespace: data-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: minio-warehouse-secret
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: minio
        property: access_key
    - secretKey: secret-key
      remoteRef:
        key: minio
        property: secret_key
