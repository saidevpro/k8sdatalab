apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-app-credentials
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: postgresql-app-credentials
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: prod/postgresql-app/credentials
        property: postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-app-init-scripts
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: postgresql-app-init-scripts
    creationPolicy: Owner
  data:
    - secretKey: init.sql
      remoteRef:
        key: prod/postgresql-app/initdb
        property: init_sql
