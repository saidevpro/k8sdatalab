apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-login-secret
  namespace: mlops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cluster-store
    kind: ClusterSecretStore
  target:
    name: mlflow-auth-admin
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: prod/mlflow/auth-login
        property: user
    - secretKey: password
      remoteRef:
        key: prod/mlflow/auth-login
        property: password


