{{- with .Values.minkms.configuration }}
{{- if not .existingSecret }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .name | default (printf "%s-configuration" ($.Values.minkms.name | default $.Release.Name)) | quote }}
  namespace: {{ $.Values.namespaceOverride | default $.Release.Namespace | quote }}
  {{- with $.Values.annotations }}
  annotations:
    {{ . | toYaml | nindent 4 }}
  {{- end }}
  {{- with $.Values.labels }}
  labels:
    {{ . | toYaml | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  "server-config.yaml": |-
    version: v1
    {{- if and .hsm .hsm.minio .hsm.minio.minkms }}
    hsm:
      minio:
        minkms:
          {{- .hsm.minio.minkms | toYaml | nindent 10 }}
    {{- end }}
    {{- if and .hsm .hsm.hashicorp .hsm.hashicorp.vault }}
    hsm:
      hashicorp:
        vault:
          {{- .hsm.hashicorp.vault | toYaml | nindent 10 }}
    {{- end }}
{{- end }}
{{- end }}
