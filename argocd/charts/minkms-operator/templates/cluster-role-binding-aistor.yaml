apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: minkms
  annotations:
    minkms.min.io/authors: MinIO, Inc.
    minkms.min.io/license: Enterprise
    minkms.min.io/support: https://subnet.min.io
    minkms.min.io/version: RELEASE.2026-03-18T17-36-17Z
    {{- if $.Values.annotations }}
    {{ $.Values.annotations | toYaml | nindent 4 }}
    {{- end }}
  {{- if $.Values.labels }}
  labels:
    {{ $.Values.labels | toYaml | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: minkms
subjects:
# Include the service accounts for all (enabled) operators
{{- range $op, $int := include "aistor.operators" . | fromYaml }}
{{- $emptyObj := "{}" | fromJson -}}
{{- $operators := $.Values.operators | default $emptyObj -}}
{{- $opValue := index $operators $op | default $emptyObj }}
{{- if not $opValue.disabled }}
  - kind: ServiceAccount
    name: {{ $op }}
    namespace: {{ include "aistor.namespace" $ }}
{{- end -}}
{{- end -}}
