executor: KubernetesExecutor # ← chaque task = 1 pod k8s

fernetKeySecretName: airflow-secret-keys
webserverSecretKeySecretName: airflow-secret-keys
jwtSecretName: airflow-secret-keys
apiSecretKeySecretName: airflow-secret-keys

config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: "s3://airflow-logs/logs"
    remote_log_conn_id: "minio_logs"
    encrypt_s3_logs: "False"

images:
  airflow:
    repository: saidsow/airflow
    tag: "3.1.8"
    pullPolicy: Always
  pod_template:
    repository: saidsow/airflow
    tag: "3.1.8"
    pullPolicy: Always

apiServer:
  enabled: true
  args:
    - "bash"
    - "-c"
    - "exec airflow api-server --proxy-headers"

webserver:
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

scheduler:
  startupProbe:
    failureThreshold: 30   
    periodSeconds: 30
    timeoutSeconds: 60
    initialDelaySeconds: 30
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m

workers: 
  persistence:
    size: 2Gi
  serviceAccount:
    create: false
    name: airflow-worker
  
triggerer:
  persistence:
    size: 5Gi

data:
  metadataSecretName: airflow-metadata-connection

postgresql:
  enabled: false

redis:
  enabled: false

logs:
  persistence:
    enabled: false
    size: 2Gi
    storageClassName: longhorn

dags:
  gitSync:
    enabled: true
    repo: https://github.com/saidevpro/k8sdatalab.git
    branch: main
    subPath: src/airflow/dags
    period: 30s
    credentialsSecret: airflow-git-sync-credentials

createUserJob:
  enabled: false
  useHelmHooks: false
  env:
    - name: AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-admin-secret
          key: password
  defaultUser:
    role: Admin
    username: said
    email: saidevproject@gmail.com
    firstName: said
    lastName: dev
    password: "$(AIRFLOW_ADMIN_PASSWORD)"

migrateDatabaseJob:
  enabled: false
  useHelmHooks: false
  resources:
    requests:
      memory: 256Mi
      cpu: 250m

env:
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "false"
  - name: FORWARDED_ALLOW_IPS
    value: "*"

extraPipPackages:
  - apache-airflow-providers-openlineage
  -  "dlt==1.24.0"

extraEnv: |-
  - name: AIRFLOW__OPENLINEAGE__NAMESPACE
    value: k8sdatalab
  - name: AIRFLOW__OPENLINEAGE__TRANSPORT
    value: >-
      {"type":"http","url":"http://marquez.observability.svc.cluster.local","endpoint":"api/v1/lineage"}
  - name: AIRFLOW_VAR_MINIO_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: minio-warehouse-secret
        key: access-key
  - name: AIRFLOW_VAR_MINIO_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio-warehouse-secret
        key: secret-key
