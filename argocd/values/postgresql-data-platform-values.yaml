auth:
  existingSecret: postgresql-data-platform-credentials
  secretKeys:
    adminPasswordKey: postgres-password

primary:
  initdb:
    scriptsSecret: postgresql-data-platform-init-scripts
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn
