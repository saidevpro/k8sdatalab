global:
  strict_mode: true
  graph_service_impl: elasticsearch

  datahub:
    version: v1.5.0.1
    systemUpdate:
      enabled: true
      consolidatedUpgrade: true

    metadata_service_authentication:
      enabled: true
      systemClientId: "__datahub_system"

      systemClientSecret:
        secretRef: "datahub-auth-secrets"
        secretKey: "system_client_secret"

      tokenService:
        signingKey:
          secretRef: "datahub-auth-secrets"
          secretKey: "token_service_signing_key"
        salt:
          secretRef: "datahub-auth-secrets"
          secretKey: "token_service_salt"

      provisionSecrets:
        enabled: false

    encryptionKey:
      secretRef: "datahub-encryption-secrets"
      secretKey: "encryption_key_secret"

    provisionSecret:
      enabled: false

  elasticsearch:
    host: "opensearch-cluster-master.data-platform.svc.cluster.local"
    port: "9200"
    useSSL: "false"
    insecure: "false"
    skipcheck: "false"
    engineType: "OPENSEARCH_2"
    autoDetect: "false"

  kafka:
    bootstrap:
      server: "kafka-cluster-kafka-bootstrap.streaming.svc.cluster.local:9092"
    schemaregistry:
      type: INTERNAL
      configureCleanupPolicy: false
    precreateTopics: true

  sql:
    datasource:
      host: "postgresql-data-platform.data-platform.svc.cluster.local:5432"
      hostForpostgresqlClient: "postgresql.data-platform.svc.cluster.local"
      port: "5432"
      url: "jdbc:postgresql://postgresql-data-platform.data-platform.svc.cluster.local:5432/datahub"
      driver: "org.postgresql.Driver"
      database: "datahub"
      username: "datahub"
      password:
        secretRef: datahub-postgresql-secret
        secretKey: password

datahubSystemUpdate:
  enabled: true
  sql:
    setup:
      enabled: true
      createTables: true
      createDatabase: false
      createUser: false
  elasticsearch:
    setup:
      enabled: true
      createUser: false

postgresqlSetupJob:
  enabled: false

mysqlSetupJob:
  enabled: false

kafkaSetupJob:
  enabled: true

elasticsearchSetupJob:
  enabled: false

datahub-gms:
  enabled: true

datahub-frontend:
  enabled: true
  service:
    type: ClusterIP
    
  existingGmsSecret: "datahub-gms-secret"

  extraEnvs:
    - name: AUTH_COOKIE_SAME_SITE
      value: "LAX"
    - name: AUTH_COOKIE_SECURE
      value: "true"

datahub-mae-consumer:
  enabled: true

datahub-mce-consumer:
  enabled: true

acryl-datahub-actions:
  enabled: true
