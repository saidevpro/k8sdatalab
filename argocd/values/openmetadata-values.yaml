openmetadata:
  config:

    elasticsearch:
      host: opensearch-cluster-master.data-platform.svc.cluster.local
      searchType: opensearch
      port: 9200
      scheme: http

    database:
      host: openmetadata-mysql.observability.svc.cluster.local
      port: 3306
      driverClass: com.mysql.cj.jdbc.Driver
      dbScheme: mysql
      databaseName: openmetadata_db
      auth:
        username: openmetadata
        password:
          secretRef: openmetadata-mysql-secret
          secretKey: mysql-password
      dbParams: "allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"

    pipelineServiceClientConfig:
      airflow:
        apiEndpoint: http://airflow-api-server.data-platform.svc.cluster.local:8080
        auth:
          username: openmetadata
          password:
            secretRef: openmetadata-airflow-secret
            secretKey: airflow-password

ingress:
  enabled: false