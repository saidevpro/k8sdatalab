auth:
  existingSecret: postgresql-app-credentials
  secretKeys:
    adminPasswordKey: postgres-password

primary:
  initdb:
    scriptsSecret: postgresql-app-init-scripts
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

  persistence:
    enabled: true
    size: 1Gi
    storageClass: longhorn
