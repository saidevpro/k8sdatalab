apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-data-platform
spec:
  project: lab-system
  source:
    repoURL: https://github.com/saidevpro/k8sdatalab
    targetRevision: main
    path: argocd/charts/postgresql
    helm:
      valueFiles:
        - ../../values/postgresql-data-platform-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data-platform
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
