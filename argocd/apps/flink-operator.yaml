apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-operator
spec:
  project: lab-system
  source:
    repoURL: https://github.com/saidevpro/k8sdatalab
    targetRevision: main
    path: argocd/charts/flink-kubernetes-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
