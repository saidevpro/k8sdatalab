apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-airflow
spec:
  project: lab-system
  source:
    repoURL: https://github.com/saidevpro/k8sdatalab
    targetRevision: main
    path: argocd/charts/postgresql
    helm:
      valueFiles:
        - ../../values/postgresql-airflow-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
