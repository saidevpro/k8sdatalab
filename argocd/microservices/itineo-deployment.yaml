apiVersion: apps/v1
kind: Deployment
metadata:
  name: itineo
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itineo
  template:
    metadata:
      labels:
        app: itineo
    spec:
      containers:
        - name: itineo
          image: saidsow/itineo:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: itineo
  namespace: apps
spec:
  selector:
    app: itineo
  ports:
    - port: 8000
      targetPort: 8000
