                  }
                },
                "ResultPath": null,
                "Next": "GoldList"
              },
              "GoldList": {
                "Type": "Pass",
                "Result": [
                  {"n":"dim_stops","a":"gold/gtfs/dim_stops.py","p":"${MediumConf}"},
                  {"n":"trip_schedule","a":"gold/gtfs/trip_schedule.py","p":"${LargeConf}"},
                  {"n":"service_calendar","a":"gold/gtfs/service_calendar.py","p":"${MediumConf}"},
                  {"n":"transfer_walking","a":"gold/gtfs/transfer_walking.py","p":"${MediumConf}"}
                ],
