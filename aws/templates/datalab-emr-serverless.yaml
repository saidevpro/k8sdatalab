AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Datalab - batch data processing on AWS EMR Serverless (mirror of the on-prem
  Airflow batch DAGs). Provisions network, KMS, S3 warehouse, Glue catalog,
  parameters/secrets, IAM, ECR (+push user), EMR Serverless application with
  shared Spark config, per-layer CloudWatch log groups, and Step Functions
  state machines (one per DAG) triggered by EventBridge Scheduler.

# ---------------------------------------------------------------------------
# Deploy in 2 phases (the Spark jobs are baked into a custom image):
#   1. Deploy WITHOUT SparkImageUri  -> creates ECR repo, push user, network,
#      storage, catalog, params/secrets, IAM, log groups.
#   2. Build & push the aws-spark-emr image to the created ECR repo.
#   3. Re-deploy WITH SparkImageUri=<repo-uri>:<tag> -> creates the EMR
#      Serverless application, Step Functions state machines and schedules.
# ---------------------------------------------------------------------------

Parameters:
  Prefix:
    Type: String
    Default: datalab
    Description: Name prefix for all resources.
  SparkRepoName:
    Type: String
    Default: aws-spark-emr
    Description: >
      Existing ECR repository (built and owned by the CI image pipeline) that
      holds the aws-spark-emr image. Referenced, not created, by this stack.
  SparkImageUri:
    Type: String
    Default: ""
    Description: >
      ECR image URI (repo:tag) of the aws-spark-emr image. Leave empty for
      phase 1; set it for phase 2 to create the EMR app and orchestration.
  PrimDatasetUri:
    Type: String
    Default: "https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets"
    Description: >
      Base URI of the Ile-de-France Mobilites PRIM Explore API; jobs append
      /<dataset>/exports/csv.
  PrimDatasetToken:
    Type: String
    Default: "REPLACE_ME"
    NoEcho: true
    Description: PRIM API token (stored in Secrets Manager).
  EmrReleaseLabel:
    Type: String
    Default: emr-7.9.0
  NatAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI for the t3.nano NAT instance.

Mappings:
  # EMR Serverless ignores spark-submit --properties-file, so the size profiles
  # (mirroring .confs/spark/aws/spark-{small,medium,large}.conf) are injected
  # inline as --conf into each job's SparkSubmitParameters.
  SparkSizing:
    small:
      Conf: "--conf spark.executor.instances=1 --conf spark.executor.cores=1 --conf spark.executor.memory=2g --conf spark.driver.cores=1 --conf spark.driver.memory=2g"
    medium:
      Conf: "--conf spark.executor.instances=2 --conf spark.executor.cores=2 --conf spark.executor.memory=4g --conf spark.driver.cores=2 --conf spark.driver.memory=4g"
    large:
      Conf: "--conf spark.executor.instances=2 --conf spark.executor.cores=4 --conf spark.executor.memory=8g --conf spark.driver.cores=4 --conf spark.driver.memory=8g"

Conditions:
  HasImage: !Not [!Equals [!Ref SparkImageUri, ""]]

Resources:

  # =========================================================================
  # NETWORK
  # EMR's default managed network is IPv6-only and cannot reach the IPv4-only
  # PRIM data host (data.iledefrance-mobilites.fr). Jobs run in private subnets
  # and egress IPv4 through a t4g.nano NAT instance (far cheaper than a managed
  # NAT gateway). An S3 gateway endpoint keeps warehouse traffic off the NAT.
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-public" }]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-private-a" }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NatRouter
  PrivateSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnetA }
  PrivateSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnetB }

  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [ !Ref PrivateRouteTable ]

  NatSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Prefix} NAT instance"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: "-1", CidrIp: 10.0.0.0/16 }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }
  EmrSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${Prefix} EMR Serverless jobs"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 0.0.0.0/0 }

  NatRouter:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.nano
      ImageId: !Ref NatAmiId
      SubnetId: !Ref PublicSubnet
      SourceDestCheck: false
      SecurityGroupIds: [ !Ref NatSecurityGroup ]
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-nat" }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf -y install iptables-nft iptables-services
          sysctl -w net.ipv4.ip_forward=1
          echo 'net.ipv4.ip_forward=1' > /etc/sysctl.d/99-nat.conf
          IFACE=$(ip -o -4 route show to default | awk '{print $5; exit}')
          iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          iptables-save > /etc/sysconfig/iptables
          systemctl enable --now iptables

  # =========================================================================
  # KMS  (warehouse data encryption)
  # =========================================================================
  WarehouseKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${Prefix} warehouse data encryption key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  WarehouseKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Prefix}-warehouse"
      TargetKeyId: !Ref WarehouseKey

  # =========================================================================
  # STORAGE
  # =========================================================================
  WarehouseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-warehouse-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt WarehouseKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-logs-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Scratch bucket for jobs that stage extracted files (gtfs / validations).
  TmpBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-tmp-spark-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: expire-tmp
            Status: Enabled
            ExpirationInDays: 2
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # =========================================================================
  # GLUE DATA CATALOG  (Iceberg namespaces = Glue databases)
  # Created by the Spark jobs (CREATE NAMESPACE IF NOT EXISTS), not managed
  # here, so the stack is idempotent against a pre-existing catalog.
  # =========================================================================

  # =========================================================================
  # CONFIG  (SSM = simple values, Secrets Manager = secrets)
  # =========================================================================
  PrimUriParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${Prefix}/prim/dataset-uri"
      Type: String
      Value: !Ref PrimDatasetUri

  PrimTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Prefix}/prim/token"
      Description: PRIM API token
      SecretString: !Ref PrimDatasetToken

  # =========================================================================
  # ECR  (+ push user with access/secret key)
  # The aws-spark-emr repository is built and owned by the CI image pipeline
  # (its EMR-pull repository policy lives there), so it is referenced via
  # SparkRepoName, not created here.
  # =========================================================================
  EcrPushUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${Prefix}-ecr-push"
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Auth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                Resource: "*"
              - Sid: PushPull
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${SparkRepoName}"

  EcrPushAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref EcrPushUser

  # =========================================================================
  # IAM ROLES
  # =========================================================================
  EmrJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-emr-job-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: emr-serverless.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt WarehouseBucket.Arn
                  - !GetAtt LogsBucket.Arn
                  - !GetAtt TmpBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "${WarehouseBucket.Arn}/*"
                  - !Sub "${LogsBucket.Arn}/*"
                  - !Sub "${TmpBucket.Arn}/*"
        - PolicyName: glue-catalog
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:BatchCreatePartition
                  - glue:CreatePartition
                  - glue:UpdatePartition
                  - glue:DeletePartition
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:BatchGetPartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*"
        - PolicyName: kms-warehouse
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt WarehouseKey.Arn
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Prefix}/emr/*:log-stream:*"

  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-sfn-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: emr-serverless
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - emr-serverless:StartJobRun
                  - emr-serverless:GetJobRun
                  - emr-serverless:CancelJobRun
                Resource:
                  - !Sub "arn:aws:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EmrJobRole.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref PrimTokenSecret
              - Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForEMRServerlessJobRule"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-sfn
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Prefix}-*"

  # =========================================================================
  # CLOUDWATCH LOG GROUPS  (grouped by layer; stream prefix = domain/dataset)
  # =========================================================================
  BronzeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/emr/bronze"
      RetentionInDays: 14
  SilverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/emr/silver"
      RetentionInDays: 14
  GoldLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/emr/gold"
      RetentionInDays: 14

  # =========================================================================
  # EMR SERVERLESS APPLICATION  (shared Spark config lives here)
  # =========================================================================
  SparkApplication:
    Type: AWS::EMRServerless::Application
    Condition: HasImage
    Properties:
      Name: !Sub "${Prefix}-spark"
      ReleaseLabel: !Ref EmrReleaseLabel
      Type: SPARK
      Architecture: X86_64
      ImageConfiguration: { ImageUri: !Ref SparkImageUri }
      AutoStartConfiguration: { Enabled: true }
      AutoStopConfiguration: { Enabled: true, IdleTimeoutMinutes: 15 }
      MaximumCapacity: { Cpu: "16 vCPU", Memory: "64 GB", Disk: "200 GB" }
      NetworkConfiguration:
        SubnetIds: [ !Ref PrivateSubnetA, !Ref PrivateSubnetB ]
        SecurityGroupIds: [ !Ref EmrSecurityGroup ]
      RuntimeConfiguration:
        - Classification: spark-defaults
          Properties:
            spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            spark.sql.catalog.glue_catalog: org.apache.iceberg.spark.SparkCatalog
            spark.sql.catalog.glue_catalog.catalog-impl: org.apache.iceberg.aws.glue.GlueCatalog
            spark.sql.catalog.glue_catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
            spark.sql.catalog.glue_catalog.warehouse: !Sub "s3://${Prefix}-warehouse-${AWS::AccountId}/warehouse/"
            spark.sql.catalog.glue_catalog.glue.id: !Ref AWS::AccountId
            spark.sql.catalog.glue_catalog.s3.sse.type: kms
            spark.sql.catalog.glue_catalog.s3.sse.key: !GetAtt WarehouseKey.Arn
            spark.sql.shuffle.partitions: "20"
            spark.sql.adaptive.enabled: "true"
            spark.emr-serverless.driverEnv.ICEBERG_CATALOG_NAME: glue_catalog
            spark.executorEnv.ICEBERG_CATALOG_NAME: glue_catalog
            spark.emr-serverless.driverEnv.SPARK_TMP_BUCKET: !Sub "${Prefix}-tmp-spark-${AWS::AccountId}"

  # =========================================================================
  # STEP FUNCTIONS  (one per batch DAG: bronze -> silver -> gold)
  # =========================================================================
  AccessibilitesStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Condition: HasImage
    Properties:
      StateMachineName: !Sub "${Prefix}-etl-accessibilites-gares"
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub
        - |
          {
            "Comment": "accessibilites_gares: bronze -> silver -> gold",
            "StartAt": "GetToken",
            "States": {
              "GetToken": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:secretsmanager:getSecretValue",
                "Parameters": { "SecretId": "${SecretArn}" },
                "ResultPath": "$.prim",
                "Next": "Bronze"
              },
              "Bronze": {
                "Type": "Task",
                "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                "Parameters": {
                  "ApplicationId": "${AppId}",
                  "ExecutionRoleArn": "${JobRole}",
                  "Name": "ingestion-accessibilites-gares--bronze",
                  "JobDriver": { "SparkSubmit": {
                    "EntryPoint": "local:///opt/spark/jobs/bronze/ingestion_prim_idfm_dataset.py",
                    "SparkSubmitParameters.$": "States.Format('${SmallConf} --conf spark.emr-serverless.driverEnv.NESSIE_NAMESPACE=bronze --conf spark.emr-serverless.driverEnv.DATASET=accessibilite-en-gare --conf spark.emr-serverless.driverEnv.DESTINATION_TABLE=glue_catalog.bronze.accessibility_gares --conf spark.emr-serverless.driverEnv.PRIM_DATASET_URI=${PrimUri} --conf spark.emr-serverless.driverEnv.PRIM_DATASET_TOKEN={}', $.prim.SecretString)"
                  } },
                  "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                    "Enabled": true, "LogGroupName": "/${Prefix}/emr/bronze", "LogStreamNamePrefix": "accessibilites_gares"
                  } } }
                },
                "Next": "Silver"
              },
              "Silver": {
                "Type": "Task",
                "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                "Parameters": {
                  "ApplicationId": "${AppId}",
                  "ExecutionRoleArn": "${JobRole}",
                  "Name": "transformation-accessibilites-gares--silver",
                  "JobDriver": { "SparkSubmit": {
                    "EntryPoint": "local:///opt/spark/jobs/silver/accessibilites/transform_accessiblites_gares__silver.py",
                    "SparkSubmitParameters": "${SmallConf}"
                  } },
                  "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                    "Enabled": true, "LogGroupName": "/${Prefix}/emr/silver", "LogStreamNamePrefix": "accessibilites_gares"
                  } } }
                },
                "Next": "Gold"
              },
              "Gold": {
                "Type": "Task",
                "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                "Parameters": {
                  "ApplicationId": "${AppId}",
                  "ExecutionRoleArn": "${JobRole}",
                  "Name": "publishing-accessibilites-gares--gold",
                  "JobDriver": { "SparkSubmit": {
                    "EntryPoint": "local:///opt/spark/jobs/gold/accessibility/gold_station_accessibility.py",
                    "SparkSubmitParameters": "${SmallConf}"
                  } },
                  "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                    "Enabled": true, "LogGroupName": "/${Prefix}/emr/gold", "LogStreamNamePrefix": "accessibilites_gares"
                  } } }
                },
                "End": true
              }
            }
          }
        - AppId: !Ref SparkApplication
          JobRole: !GetAtt EmrJobRole.Arn
          SecretArn: !Ref PrimTokenSecret
          PrimUri: !Ref PrimDatasetUri
          SmallConf: !FindInMap [SparkSizing, small, Conf]

  ElevatorsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Condition: HasImage
    Properties:
      StateMachineName: !Sub "${Prefix}-etl-elevators"
      RoleArn: !GetAtt StepFunctionsRole.Arn
      DefinitionString: !Sub
        - |
          {
            "Comment": "elevators: bronze -> silver -> gold",
            "StartAt": "GetToken",
            "States": {
              "GetToken": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:secretsmanager:getSecretValue",
                "Parameters": { "SecretId": "${SecretArn}" },
                "ResultPath": "$.prim",
                "Next": "Bronze"
              },
              "Bronze": {
                "Type": "Task",
                "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                "Parameters": {
                  "ApplicationId": "${AppId}",
                  "ExecutionRoleArn": "${JobRole}",
                  "Name": "ingestion-elevators--bronze",
                  "JobDriver": { "SparkSubmit": {
                    "EntryPoint": "local:///opt/spark/jobs/bronze/ingestion_prim_idfm_dataset.py",
                    "SparkSubmitParameters.$": "States.Format('${SmallConf} --conf spark.emr-serverless.driverEnv.NESSIE_NAMESPACE=bronze --conf spark.emr-serverless.driverEnv.DATASET=etat-des-ascenseurs --conf spark.emr-serverless.driverEnv.DESTINATION_TABLE=glue_catalog.bronze.elevators --conf spark.emr-serverless.driverEnv.PRIM_DATASET_URI=${PrimUri} --conf spark.emr-serverless.driverEnv.PRIM_DATASET_TOKEN={}', $.prim.SecretString)"
                  } },
                  "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                    "Enabled": true, "LogGroupName": "/${Prefix}/emr/bronze", "LogStreamNamePrefix": "elevators"
                  } } }
                },
                "Next": "Silver"
              },
              "Silver": {
                "Type": "Task",
                "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                "Parameters": {
                  "ApplicationId": "${AppId}",
                  "ExecutionRoleArn": "${JobRole}",
                  "Name": "transformation-elevators--silver",
                  "JobDriver": { "SparkSubmit": {
                    "EntryPoint": "local:///opt/spark/jobs/silver/elevators/silver_elevators.py",
                    "SparkSubmitParameters": "${SmallConf}"
                  } },
                  "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                    "Enabled": true, "LogGroupName": "/${Prefix}/emr/silver", "LogStreamNamePrefix": "elevators"
                  } } }
                },
                "Next": "Gold"
              },
              "Gold": {
                "Type": "Task",
                "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                "Parameters": {
                  "ApplicationId": "${AppId}",
                  "ExecutionRoleArn": "${JobRole}",
                  "Name": "publishing-elevators--gold",
                  "JobDriver": { "SparkSubmit": {
                    "EntryPoint": "local:///opt/spark/jobs/gold/elevators/gold_elevators.py",
                    "SparkSubmitParameters": "${SmallConf}"
                  } },
                  "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                    "Enabled": true, "LogGroupName": "/${Prefix}/emr/gold", "LogStreamNamePrefix": "elevators"
                  } } }
                },
                "End": true
              }
            }
          }
        - AppId: !Ref SparkApplication
          JobRole: !GetAtt EmrJobRole.Arn
          SecretArn: !Ref PrimTokenSecret
          PrimUri: !Ref PrimDatasetUri
          SmallConf: !FindInMap [SparkSizing, small, Conf]

  RelationsStateMachine:
