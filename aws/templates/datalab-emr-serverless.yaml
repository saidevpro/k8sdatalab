                        "ApplicationId": "${AppId}",
                        "ExecutionRoleArn": "${JobRole}",
                        "Name.$": "States.Format('publishing-gtfs-{}--gold', $.n)",
                        "JobDriver": { "SparkSubmit": {
                          "EntryPoint.$": "States.Format('local:///opt/spark/jobs/{}', $.a)",
