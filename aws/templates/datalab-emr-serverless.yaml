                  } } }
                },
                "ResultPath": null,
                "Next": "SilverList"
              },
              "SilverList": {
                "Type": "Pass",
                "Result": [
                  {"t":"calendar_dates","p":"${MediumConf}"},{"t":"calendars","p":"${MediumConf}"},
                  {"t":"trips","p":"${MediumConf}"},{"t":"pathways","p":"${MediumConf}"},
                  {"t":"transfers","p":"${MediumConf}"},{"t":"stop_times","p":"${LargeConf}"},
                  {"t":"routes","p":"${MediumConf}"},{"t":"wheelchairs","p":"${MediumConf}"},
                  {"t":"stop_entrances","p":"${MediumConf}"},{"t":"stations","p":"${MediumConf}"},
                  {"t":"stop_points","p":"${MediumConf}"}
                ],
                "ResultPath": "$.tables",
                "Next": "Silver"
              },
              "Silver": {
                "Type": "Map",
                "ItemsPath": "$.tables",
                "MaxConcurrency": 3,
                "ItemProcessor": {
                  "ProcessorConfig": { "Mode": "INLINE" },
                  "StartAt": "SilverJob",
                  "States": {
                    "SilverJob": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::emr-serverless:startJobRun.sync",
                      "Parameters": {
                        "ApplicationId": "${AppId}",
                        "ExecutionRoleArn": "${JobRole}",
                        "Name.$": "States.Format('transformation-gtfs-{}--silver', $.t)",
                        "JobDriver": { "SparkSubmit": {
                          "EntryPoint.$": "States.Format('local:///opt/spark/jobs/silver/gtfs/transform_{}.py', $.t)",
                          "SparkSubmitParameters.$": "$.p"
                        } },
                        "ConfigurationOverrides": { "MonitoringConfiguration": { "CloudWatchLoggingConfiguration": {
                          "Enabled": true, "LogGroupName": "/${Prefix}/emr/silver", "LogStreamNamePrefix.$": "States.Format('gtfs_{}', $.t)"
                        } } }
                      },
                      "End": true
