# Declarative catalog of container images built from this repo.
#
# Images are pushed to Docker Hub as: $DOCKERHUB_USERNAME/<image>:<version>
#
# Folder convention: docker-images/<image>/<version>/Dockerfile
#
# Fields:
#   image              (required)  Image name.
#   version            (required)  Image tag.
#   context            (optional)  Docker build context.       Default: "."
#   dockerfile         (optional)  Path to Dockerfile.         Default: docker-images/<image>/<version>/Dockerfile
#   platforms          (optional)  Target platforms.           Default: linux/amd64
#   depends_on         (optional)  External paths COPY'd into the image. Changes trigger rebuild.
#   depends_on_images  (optional)  Other in-repo images this FROMs. Drives build ordering and transitive rebuilds.

images:
  - image: spark-base
    version: 3.5.8

  - image: spark
    version: 3.5.8
    depends_on_images:
      - spark-base:3.5.8
    depends_on:
      - src/spark/jobs
      - .confs/spark

  - image: jupyterhub-datalab
    version: spark-3.5.8
    depends_on_images:
      - spark:3.5.8

  - image: jupyterhub-datalab
    version: ml-pytorch-mlflow

  - image: airflow
    version: 3.1.8
    depends_on_images:
      - spark:3.5.8

  - image: flink
    version: 2.2.0
    depends_on:
      - src/flink/jobs

  - image: kafka
    version: 0.1.0
    depends_on:
      - src/kafka

  - image: app
    version: 0.1.0
    depends_on:
      - src/app

  - image: mlflow
    version: 3.7.0
